[project]
name = "openllv-playground"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "gradio>=6.26.0",
    "openllv",
]

[tool.uv.sources]
openllv = { git = "https://github.com/glory-wan/openLLV" }
torch = [
    { index = "pytorch", marker = "sys_platform == 'linux'" },
]
torchvision = [
    { index = "pytorch", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.5",
]
